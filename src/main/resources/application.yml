server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8000}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventforge}
    username: ${DB_USERNAME:eventforge}
    password: ${DB_PASSWORD:eventforge}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-to-a-secure-256-bit-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
