services:
  postgres:
    image: postgres:15.10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventforge}
      POSTGRES_USER: ${POSTGRES_USER:-eventforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventforge}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
  eventforge:
    build: .
    ports:
      - "8000:8000"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8000
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eventforge}
      DB_USERNAME: ${POSTGRES_USER:-eventforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eventforge}
      JWT_SECRET: ${JWT_SECRET:?Set a secure JWT_SECRET in your environment}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
